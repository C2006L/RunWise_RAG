server:
  port: 8080
  servlet:
    context-path: /

spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  # MySQL 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/runwise?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: CL20060615

  # Redis 配置
  redis:
    host: localhost
    port: 6379
    database: 0
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 4
        min-idle: 0
        max-wait: -1ms

  # Jackson 配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# RunWise 自定义配置
runwise:
  # 本地开发上传目录；生产环境可通过 RUNWISE_UPLOAD_DIR 覆盖
  upload-dir: ${RUNWISE_UPLOAD_DIR:uploads}

  # JWT 配置
  jwt:
    secret: RunWiseSecretKey2024ForJwtTokenGenerationPleaseChangeInProduction
    access-token-expire: 7200000      # 2小时 (毫秒)
    refresh-token-expire: 604800000   # 7天 (毫秒)
    header: Authorization
    prefix: "Bearer "

  # 微信小程序配置
  wechat:
    appid: your_appid
    secret: your_secret

  # LLM 大模型配置（本地 Ollama，免费离线；换模型改 model 并先执行 ollama pull）
  llm:
    ollama:
      base-url: http://127.0.0.1:11434
      model: qwen2.5:3b
      temperature: 0.7        # 越低越稳定保守，越高越发散随机（0~2）
      num-predict: 500        # 最大生成 token 数（约 300~400 汉字），防止跑题说个没完

  # RAG Python 微服务地址（后续正式环境使用）
  rag:
    base-url: http://localhost:5000

  # 阿里云 OSS 配置 (后续打卡图片上传使用)
  oss:
    endpoint: oss-cn-hangzhou.aliyuncs.com
    access-key-id: your_access_key_id
    access-key-secret: your_access_key_secret
    bucket-name: runwise
    sts-role-arn: your_sts_role_arn

# Knife4j 配置
knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    com.runwise: debug
    org.springframework: warn
