server:
  # 8080 已被本机另一个项目占用；可通过 SERVER_PORT 覆盖
  port: ${SERVER_PORT:8081}
  servlet:
    context-path: /

spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  # MySQL 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # MYSQL_* 保留为完整连接覆盖；日常开发可使用更直观的 DB_* 变量
    url: "${MYSQL_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:runwise}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}"
    username: ${MYSQL_USERNAME:${DB_USERNAME:root}}
    password: ${MYSQL_PASSWORD:${DB_PASSWORD}}

  # Redis 配置
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    database: ${REDIS_DATABASE:0}
    password: ${REDIS_PASSWORD:}
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 4
        min-idle: 0
        max-wait: -1ms

  # Jackson 配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# RunWise 自定义配置
runwise:
  # 本地开发上传目录；生产环境可通过 RUNWISE_UPLOAD_DIR 覆盖
  upload-dir: ${RUNWISE_UPLOAD_DIR:uploads}

  # JWT 配置
  jwt:
    secret: ${JWT_SECRET}
    access-token-expire: ${JWT_ACCESS_EXPIRE:7200000}      # 2小时 (毫秒)
    refresh-token-expire: ${JWT_REFRESH_EXPIRE:604800000}  # 7天 (毫秒)
    header: Authorization
    prefix: "Bearer "

  # 微信小程序配置
  wechat:
    appid: ${WECHAT_APPID:}
    secret: ${WECHAT_SECRET:}

  # LLM 大模型配置（本地 Ollama，免费离线；换模型改 model 并先执行 ollama pull）
  llm:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://127.0.0.1:11434}
      model: ${OLLAMA_MODEL:qwen2.5:3b}
      temperature: 0.7        # 越低越稳定保守，越高越发散随机（0~2）
      num-predict: 500        # 最大生成 token 数（约 300~400 汉字），防止跑题说个没完

  # RAG Python 微服务地址（后续正式环境使用）
  rag:
    base-url: ${RAG_BASE_URL:http://localhost:5000}
    enabled: ${RAG_ENABLED:true}

  # 阿里云 OSS 配置 (后续打卡图片上传使用)
  oss:
    endpoint: ${OSS_ENDPOINT:}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
    bucket-name: ${OSS_BUCKET_NAME:}
    sts-role-arn: ${OSS_STS_ROLE_ARN:}

# Knife4j 配置
knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    com.runwise: debug
    org.springframework: warn
