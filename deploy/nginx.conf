worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    client_max_body_size 6m;
    # Best-effort per-IP protection. Caddy is the sole trusted public proxy.
    set_real_ip_from 172.30.41.0/24;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=ai:10m rate=6r/m;
    limit_req_zone $binary_remote_addr zone=uploads:10m rate=20r/m;
    limit_conn_zone $binary_remote_addr zone=ai_connections:10m;
    limit_req_status 429;
    limit_conn_status 429;
    server {
        listen 8080;
        root /usr/share/nginx/html;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Request-ID $request_id always;
        error_page 429 = @too_many;
        location @too_many {
            default_type application/json;
            return 429 '{"code":429,"message":"请求过于频繁，请稍后重试"}';
        }
        location = /healthz { access_log off; default_type text/plain; return 200 'ok'; }
        location ~ ^/(internal|doc\.html|swagger|v3/api-docs|webjars) { return 404; }
        location ~ ^/api/(auth/(login|login-password|register|refresh)|admin/auth/login)$ {
            limit_req zone=auth burst=5 nodelay;
            include /etc/nginx/proxy.conf;
        }
        location ~ ^/api/(qa/(ask|plan-drafts)|files/recognize-checkin)$ {
            limit_req zone=ai burst=2 nodelay;
            limit_conn ai_connections 2;
            include /etc/nginx/proxy.conf;
        }
        location /api/ { include /etc/nginx/proxy.conf; }
        location = /api/files/checkin-image {
            limit_req zone=uploads burst=2 nodelay;
            limit_conn ai_connections 2;
            include /etc/nginx/proxy.conf;
        }
        location /uploads/ { include /etc/nginx/proxy.conf; }
        location = /admin { return 302 /admin/; }
        location /admin/ { try_files $uri $uri/ /admin/index.html; }
        location / { try_files $uri $uri/ /index.html; }
    }
}
